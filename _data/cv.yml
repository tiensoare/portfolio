    Publications:
      - title: Assessing Large Language Models for Stabilizing Numerical Expressions in Scientific Software
        authors:
          - Tien Nguyen
          - Kirshanthan Sundararajah
          - Muhammad Ali Gulzar
        publisher: arXiv (in submission to ICSE 2027)
        releaseDate: 2026-04-08
        url: https://arxiv.org/abs/2604.04854
        summary: First evaluation of LLM reasoning for high-precision numerical computation, showing that LLMs fix many expressions that classical tools cannot, making them a complementary tool for numerical robustness.
 
      - title: Are the Majority of Public Computational Notebooks Pathologically Non-Executable?
        authors:
          - Tien Nguyen
          - Waris Gill
          - Muhammad Ali Gulzar
        publisher: IEEE/ACM MSR 2025
        releaseDate: 2025-06-13
        url: https://ieeexplore.ieee.org/document/11025746
        summary: Large-scale study of 42,546 public Jupyter notebooks showing only 21.3% are truly non-executable (far below prior estimates of up to 76%), plus an LLM-based method for recovering full and partial executability.

